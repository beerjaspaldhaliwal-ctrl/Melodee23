name: Build plugin

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmake_args: ""
          - name: macOS
            os: macos-14
            cmake_args: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15'
          - name: Linux
            os: ubuntu-22.04
            cmake_args: -G Ninja

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          set -e
          ART=build/plugin/Melodee_artefacts/Release
          OUT="dist/Melodee-${{ matrix.name }}"
          mkdir -p "$OUT"
          cp -R "$ART/VST3" "$OUT/"
          [ -d "$ART/AU" ] && cp -R "$ART/AU" "$OUT/"
          [ -d "$ART/LV2" ] && cp -R "$ART/LV2" "$OUT/"
          cp -R "$ART/Standalone" "$OUT/"
          mkdir -p "$OUT/CLI"
          if [ -f build/cli/Release/melodee.exe ]; then cp build/cli/Release/melodee.exe "$OUT/CLI/";
          elif [ -f build/cli/Release/melodee ]; then cp build/cli/Release/melodee "$OUT/CLI/";
          else cp build/cli/melodee "$OUT/CLI/"; fi
          cp README.md "$OUT/"
          cp docs/INSTALL.md "$OUT/" 2>/dev/null || true
          cd dist
          if [ "$RUNNER_OS" == "Windows" ]; then 7z a "Melodee-${{ matrix.name }}.zip" "Melodee-${{ matrix.name }}" > /dev/null;
          else zip -qry "Melodee-${{ matrix.name }}.zip" "Melodee-${{ matrix.name }}"; fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Melodee-${{ matrix.name }}
          path: dist/Melodee-${{ matrix.name }}.zip

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(Melodee VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          if (-not $version) { throw "Could not read the version from CMakeLists.txt" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match the CMakeLists.txt version $version (expected v$version)"
          }

          # Use the runner's Inno Setup when it is new enough (6.3+ is needed for x64compatible); otherwise install it.
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc) -or (Get-Item $iscc).VersionInfo.FileVersionRaw -lt [version]'6.3') {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -notin 0, 1641, 3010) { throw "Installing Inno Setup failed ($LASTEXITCODE)" }
            if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          }
          Write-Host "Using Inno Setup $((Get-Item $iscc).VersionInfo.FileVersion)"

          & $iscc "/DAppVersion=$version" "/DPayloadDir=$PWD\dist\Melodee-Windows" "/O$PWD\dist" installer\windows\Melodee.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item dist\Melodee-Setup-Windows.exe | Format-List Name, Length

      - name: Test Windows installer (install, upgrade, run, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vst3Dir = Join-Path $env:CommonProgramFiles 'VST3\Melodee.vst3'
          $vst3 = Join-Path $vst3Dir 'Contents\x86_64-win\Melodee.vst3'
          $appDir = Join-Path $env:ProgramFiles 'Melodee'
          $app = Join-Path $appDir 'Melodee.exe'
          $cli = Join-Path $appDir 'CLI\melodee.exe'
          $uninstallKey = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{439E36EA-A0DF-42F0-B96F-07D608796D25}_is1'

          function Install-Melodee($log) {
            $p = Start-Process -FilePath dist\Melodee-Setup-Windows.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $log; throw "Setup exit code $($p.ExitCode)" }
            foreach ($f in @($vst3, $app, $cli, (Join-Path $appDir 'Melodee.ico'), (Join-Path $appDir 'docs\Getting started.txt'))) {
              if (-not (Test-Path $f)) { Get-Content $log; throw "Missing after install: $f" }
            }
            if (-not (Test-Path $uninstallKey)) { throw "No uninstall entry in Settings > Apps" }
          }

          Install-Melodee "$PWD\dist\install.log"
          Write-Host "Fresh install OK"

          $out = Join-Path $env:RUNNER_TEMP 'melodee_out'
          & $cli --key A --scale "Natural Minor" --prog "Am F C G" --variations 2 --out $out
          if ($LASTEXITCODE -ne 0) { throw "Installed CLI failed to run" }
          if ((Get-ChildItem $out -Filter *.mid).Count -lt 3) { throw "Installed CLI wrote no MIDI files" }
          Write-Host "Installed CLI OK"

          # Installing again over the top (what an upgrade does) must work and keep everything in place.
          Install-Melodee "$PWD\dist\upgrade.log"
          Write-Host "Reinstall / upgrade OK"

          $u = Start-Process -FilePath (Join-Path $appDir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstall exit code $($u.ExitCode)" }
          # The uninstaller hands over to a temporary copy of itself, so wait for the files to go.
          $gone = $false
          for ($i = 0; $i -lt 60 -and -not $gone; $i++) {
            $gone = -not (Test-Path $vst3Dir) -and -not (Test-Path $appDir) -and -not (Test-Path $uninstallKey)
            if (-not $gone) { Start-Sleep -Seconds 1 }
          }
          if (-not $gone) {
            Write-Host "VST3 left: $(Test-Path $vst3Dir)  App folder left: $(Test-Path $appDir)  Uninstall entry left: $(Test-Path $uninstallKey)"
            throw "Uninstall left something behind"
          }
          Write-Host "Uninstall OK"

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Melodee-Windows-Installer
          path: dist/Melodee-Setup-Windows.exe

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
          generate_release_notes: true
