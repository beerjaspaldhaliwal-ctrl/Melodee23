name: Build plugin

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmake_args: ""
          - name: macOS
            os: macos-14
            cmake_args: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15'
          - name: Linux
            os: ubuntu-22.04
            cmake_args: -G Ninja

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          set -e
          ART=build/plugin/Melodee_artefacts/Release
          OUT="dist/Melodee-${{ matrix.name }}"
          mkdir -p "$OUT"
          cp -R "$ART/VST3" "$OUT/"
          [ -d "$ART/AU" ] && cp -R "$ART/AU" "$OUT/"
          [ -d "$ART/LV2" ] && cp -R "$ART/LV2" "$OUT/"
          cp -R "$ART/Standalone" "$OUT/"
          mkdir -p "$OUT/CLI"
          if [ -f build/cli/Release/melodee.exe ]; then cp build/cli/Release/melodee.exe "$OUT/CLI/";
          elif [ -f build/cli/Release/melodee ]; then cp build/cli/Release/melodee "$OUT/CLI/";
          else cp build/cli/melodee "$OUT/CLI/"; fi
          cp README.md "$OUT/"
          cp docs/INSTALL.md "$OUT/" 2>/dev/null || true
          cd dist
          if [ "$RUNNER_OS" == "Windows" ]; then 7z a "Melodee-${{ matrix.name }}.zip" "Melodee-${{ matrix.name }}" > /dev/null;
          else zip -qry "Melodee-${{ matrix.name }}.zip" "Melodee-${{ matrix.name }}"; fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Melodee-${{ matrix.name }}
          path: dist/Melodee-${{ matrix.name }}.zip

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco upgrade innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Installing Inno Setup failed" }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(Melodee VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$version" "/DPayloadDir=$PWD\dist\Melodee-Windows" "/O$PWD\dist" installer\windows\Melodee.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item dist\Melodee-Setup-Windows.exe | Format-List Name, Length

      - name: Test Windows installer (silent install, check, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Start-Process -FilePath dist\Melodee-Setup-Windows.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$PWD\dist\install.log" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { Get-Content dist\install.log; throw "Setup exit code $($setup.ExitCode)" }

          $vst3 = Join-Path $env:CommonProgramFiles 'VST3\Melodee.vst3\Contents\x86_64-win\Melodee.vst3'
          $app = Join-Path $env:ProgramFiles 'Melodee\Melodee.exe'
          $cli = Join-Path $env:ProgramFiles 'Melodee\CLI\melodee.exe'
          foreach ($f in @($vst3, $app, $cli)) {
            if (-not (Test-Path $f)) { Get-Content dist\install.log; throw "Missing after install: $f" }
            Write-Host "Installed: $f"
          }

          & $cli --key A --scale "Natural Minor" --prog "Am F C G" --variations 2 --out "$env:RUNNER_TEMP\melodee_out"
          if ($LASTEXITCODE -ne 0) { throw "Installed CLI failed to run" }

          $uninstaller = Join-Path $env:ProgramFiles 'Melodee\unins000.exe'
          Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller hands over to a temporary copy of itself, so wait for the files to go.
          $gone = $false
          for ($i = 0; $i -lt 60 -and -not $gone; $i++) {
            $gone = -not (Test-Path (Join-Path $env:CommonProgramFiles 'VST3\Melodee.vst3')) -and -not (Test-Path $app)
            if (-not $gone) { Start-Sleep -Seconds 1 }
          }
          if (-not $gone) { throw "Uninstall left files behind" }
          Write-Host "Install and uninstall OK"

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Melodee-Windows-Installer
          path: dist/Melodee-Setup-Windows.exe

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
          generate_release_notes: true
